<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rock Paper Scissors Lizard Spock</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;700&display=swap" rel="stylesheet">


    <!-- CSS -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="container min-vh-100">

        <!-- ================= HEADER ================= -->
        <div class="row justify-content-center pt-5">

            <div class="col-10 col-md-9 col-lg-7">

                <div class="header-box">

                    <div class="game-title">
                        ROCK<br>
                        PAPER<br>
                        SCISSORS<br>
                        LIZARD<br>
                        SPOCK
                    </div>

                    <div class="score-box">
                        <div class="score-title">SCORE</div>
                        <div class="score-number">12</div>
                    </div>

                </div>

            </div>

        </div>


        <!-- ================= GAME ================= -->
        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-6">

                <div class="game-area">

                    <!-- Pentagon -->
                    <img
                        src="./images/bg-pentagon.svg"
                        class="pentagon"
                        alt="Pentagon"
                    >

                    <!-- ROCK -->
                    <button class="choice rock">
                        <img
                            src="./images/icon-rock.svg"
                            alt="Rock"
                        >
                    </button>

                    <!-- PAPER -->
                    <button class="choice paper">
                        <img
                            src="./images/icon-paper.svg"
                            alt="Paper"
                        >
                    </button>

                    <!-- SCISSORS -->
                    <button class="choice scissors shadow">
                        <img
                            src="./images/icon-scissors.svg"
                            alt="Scissors"
                        >
                    </button>

                    <!-- LIZARD -->
                    <button class="choice lizard">
                        <img
                            src="./images/icon-lizard.svg"
                            alt="Lizard"
                        >
                    </button>

                    <!-- SPOCK -->
                    <button class="choice spock">
                        <img
                            src="./images/icon-spock.svg"
                            alt="Spock">
                        </button>

                </div>

            </div>

        </div>


        <!-- ================= RULES ================= -->
        <div class="row">

            <div class="col-12">

                <button class="rules-button">
                    RULES
                </button>

            </div>

        </div>

    </div>

</body>
</html>
